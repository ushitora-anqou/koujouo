# This rule is not used by the project koujouo itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to koujouo.anqou.net resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "koujouo.fullname" . }}-factorioserver-viewer
  labels:
    {{- include "koujouo.labels" . | nindent 4 }}
rules:
- apiGroups:
  - koujouo.anqou.net
  resources:
  - factorioservers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - koujouo.anqou.net
  resources:
  - factorioservers/status
  verbs:
  - get
