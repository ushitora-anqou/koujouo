{{- if .Values.networkPolicy.enabled }}
# Allows ingress traffic to the metrics endpoint from Pods running in
# namespaces labeled with 'metrics: enabled'. Only Pods in those namespaces can
# gather data from the metrics endpoint.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "koujouo.fullname" . }}-allow-metrics-traffic
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "koujouo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "koujouo.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            metrics: enabled # Only from namespaces with this label
      ports:
        - port: 8443
          protocol: TCP
{{- end }}
