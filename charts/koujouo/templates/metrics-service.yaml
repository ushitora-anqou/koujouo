apiVersion: v1
kind: Service
metadata:
  name: {{ include "koujouo.fullname" . }}-controller-manager-metrics-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "koujouo.labels" . | nindent 4 }}
spec:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  selector:
    {{- include "koujouo.selectorLabels" . | nindent 4 }}
