# This rule is not used by the project koujouo itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the koujouo.anqou.net.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "koujouo.fullname" . }}-factorioserver-editor
  labels:
    {{- include "koujouo.labels" . | nindent 4 }}
rules:
- apiGroups:
  - koujouo.anqou.net
  resources:
  - factorioservers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - koujouo.anqou.net
  resources:
  - factorioservers/status
  verbs:
  - get
