# Secrets referenced by spec.notification, spec.backup and
# spec.downloadCredentials of the FactorioServer sample.
# Replace the placeholder values with real credentials before use.
apiVersion: v1
kind: Secret
metadata:
  name: factorioserver-sample-secrets
type: Opaque
stringData:
  discordWebhookURL: https://discord.com/api/webhooks/000000000000000000/PLACEHOLDER-TOKEN
  s3AccessKeyId: PLACEHOLDER-ACCESS-KEY-ID
  s3SecretAccessKey: PLACEHOLDER-SECRET-ACCESS-KEY
  # For spec.downloadCredentials (experimental/old builds only):
  # factorioUsername: PLACEHOLDER-USERNAME
  # factorioToken: PLACEHOLDER-TOKEN
