# Release workflow: build the image with Nix and publish it to GHCR, and, on a
# v* tag, package the Helm chart and attach it to the GitHub Release.
#
# Flow: meta (image name + final tags) -> build (matrix over the platforms,
# native runners, per-arch tag push) -> merge (imagetools create), plus chart
# (package the chart and publish the GitHub Release) on a v* tag.
#
# Conventions:
# - image: imageName and imageTag are evaluated from the flake package
#   (.#dockerImage, ghcr.io/ushitora-anqou/koujouo:latest), so flake.nix is the
#   single place that names the registry and the repository.
# - build: `nix build .#dockerImage` resolves to the runner's native system, so
#   each platform builds natively on its own runner (arm64 on an arm64 runner;
#   no cross-compilation, no emulation).
# - tags: each platform pushes <version>-linux-<arch> first, and the final tags
#   are created atomically by the merge job, so a final tag never names a
#   half-published image.
# - buildx: pinned to v0.31.0 in merge (docker/buildx#3708: `imagetools create`
#   is broken on GHCR since v0.31.1).
# - go2nix: evaluating the flake needs its Nix plugin
#   (builtins.resolveGoPackages), which the shellHook of the dev shell appends
#   to NIX_CONFIG. Every job that evaluates the flake enters the dev shell
#   first, because nix-develop exports that environment to the later steps.
# - the image jobs do not go through `make`: they run `nix build .#dockerImage`
#   directly, so a change of the Makefile cannot break the image. The chart job
#   is the exception: it runs `make release-chart`, the target a local release
#   uses, so both produce the same archive.
# - chart: the chart is released by the same v* tag. Its version is the tag
#   without the `v` (v0.1.0 -> 0.1.0), the same version the image carries, and
#   `helm package --version/--app-version` sets it without rewriting Chart.yaml.
#   The archive is attached to the GitHub Release, which is the only place it
#   is published: `gh` is preinstalled on the runner and needs no new action
#   pin, and one publication path cannot leave the chart in half of the places
#   a release is expected in. A master push publishes the image only.

name: Release image

on:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  # ── Meta: image name from the flake, final tags from the ref ──────────────
  meta:
    runs-on: ubuntu-latest
    outputs:
      repo: ${{ steps.flake-meta.outputs.repo }}
      build_tag: ${{ steps.flake-meta.outputs.build_tag }}
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          # go2nix builds its Nix plugin against the upstream Nix of nixpkgs
          # (2.34.9). Install that exact release so the plugin's ABI matches;
          # the hash is the published sha256 of the installer script.
          install_url: https://releases.nixos.org/nix/nix-2.34.9/install
          install_sha256: a03ce2e9eaf4ea1560260b9a93e311dbaf589d28fb5c9318f8d9e768ee6339d8
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Enter the Nix dev shell
        uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1

      - name: Extract the image name from the flake
        id: flake-meta
        shell: bash
        run: |
          set -euo pipefail
          meta="$(nix eval --json .#dockerImage --apply 'p: {repo = p.imageName; tag = p.imageTag;}')"
          repo="$(printf '%s' "$meta" | jq -r .repo)"
          build_tag="$(printf '%s' "$meta" | jq -r .tag)"
          if [ -z "$repo" ] || [ "$repo" = "null" ]; then
            echo "::error::The flake did not give an image name"
            exit 1
          fi
          {
            echo "repo=${repo}"
            echo "build_tag=${build_tag}"
          } >> "$GITHUB_OUTPUT"

      # `latest` follows the default branch only: a v* tag publishes vX.Y.Z
      # (and nothing else), so an old release tag cannot move `latest` back.
      - name: Compute the final tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.flake-meta.outputs.repo }}
          tags: |
            type=ref,event=branch,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=tag

  # ── Per-platform build (native runner, per-arch tag push) ─────────────────
  build:
    name: build - ${{ matrix.platform }}
    needs: meta
    # NOTE: do NOT use matrix.include for the platform -> runner mapping. An
    # include entry makes GitHub Actions spawn an extra build when its platform
    # value is not in the matrix; runs-on accepts expressions, so use a ternary.
    runs-on: ${{ contains(matrix.platform, 'arm64') && 'ubuntu-26.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ["linux/amd64", "linux/arm64"]
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          # go2nix builds its Nix plugin against the upstream Nix of nixpkgs
          # (2.34.9). Install that exact release so the plugin's ABI matches;
          # the hash is the published sha256 of the installer script.
          install_url: https://releases.nixos.org/nix/nix-2.34.9/install
          install_sha256: a03ce2e9eaf4ea1560260b9a93e311dbaf589d28fb5c9318f8d9e768ee6339d8
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Enter the Nix dev shell
        uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `nix build .#dockerImage` resolves to the runner's native system:
      # packages.x86_64-linux on amd64, packages.aarch64-linux on arm64. The
      # build needs no docker (dockerTools writes the archive itself).
      - name: Build the image with Nix
        run: nix build .#dockerImage

      - name: Load the image and push the per-arch tag
        id: push
        env:
          REPO: ${{ needs.meta.outputs.repo }}
          BUILD_TAG: ${{ needs.meta.outputs.build_tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERSION}" ]; then
            echo "::error::metadata-action produced no version for ${GITHUB_REF}"
            exit 1
          fi
          docker load -i result
          safe="${PLATFORM//\//-}" # linux/arm64 -> linux-arm64
          per_arch="${REPO}:${VERSION}-${safe}"
          # The archive holds the flake's own tag (latest), which every platform
          # would overwrite, so retag it to the per-arch tag before pushing.
          docker tag "${REPO}:${BUILD_TAG}" "${per_arch}"
          docker push "${per_arch}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${per_arch}" | cut -d@ -f2)"
          if [ -z "$digest" ] || [ "$digest" = "null" ]; then
            echo "::error::No digest produced (${PLATFORM})"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digest"
          printf '%s\n' "$digest" > "${RUNNER_TEMP}/digest/digest-${safe}.txt"
          echo "safe=${safe}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${PLATFORM}: ${per_arch} ${digest}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ steps.push.outputs.safe }}
          path: ${{ runner.temp }}/digest
          retention-days: 1
          if-no-files-found: error

  # ── Merge: create the final multi-arch tags atomically ────────────────────
  merge:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx (pinned)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # docker/buildx#3708: `imagetools create` is broken on GHCR since
          # v0.31.1, so hold buildx at the last version that works there.
          version: v0.31.0

      - name: Download the per-platform digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Create the multi-arch manifest
        env:
          REPO: ${{ needs.meta.outputs.repo }}
          TAGS: ${{ needs.meta.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find digests -type f -print | sort)
          if [ "${#files[@]}" -lt 1 ]; then
            echo "::error::No digest files found"
            exit 1
          fi
          sources=()
          for f in "${files[@]}"; do
            d="$(tr -d '[:space:]' < "$f")"
            case "$d" in
              sha256:*) : ;;
              *) echo "::error::Bad digest in $f: $d"; exit 1 ;;
            esac
            sources+=("${REPO}@${d}")
          done
          tag_args=()
          n_tags=0
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            tag_args+=(-t "$t")
            n_tags=$((n_tags + 1))
          done <<< "${TAGS}"
          if [ "${n_tags}" -lt 1 ]; then
            echo "::error::metadata-action produced no final tag"
            exit 1
          fi
          echo "Merging ${#files[@]} digest(s) into ${n_tags} tag(s)" | tee -a "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Verify the merged manifests
        env:
          TAGS: ${{ needs.meta.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            echo "::group::${t}"
            docker buildx imagetools inspect "${t}" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done <<< "${TAGS}"

  # ── Chart: package the chart and attach it to the GitHub Release ──────────
  #
  # A v* tag only: a master push updates the image tags of the branch and
  # releases nothing.
  #
  # No step may continue on failure: a release without its chart (or a chart
  # without its release) is a broken release, and hiding the error in a warning
  # would leave it that way while the run reports success. `needs: [meta]` puts
  # this job beside `build` and `merge`, not after them, so a failure here can
  # leave the image tags in GHCR without a GitHub Release, and a release naming
  # image tags that `merge` did not create yet; either way the run is red.
  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [meta]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the chart archive to it
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          # go2nix builds its Nix plugin against the upstream Nix of nixpkgs
          # (2.34.9). Install that exact release so the plugin's ABI matches;
          # the hash is the published sha256 of the installer script.
          install_url: https://releases.nixos.org/nix/nix-2.34.9/install
          install_sha256: a03ce2e9eaf4ea1560260b9a93e311dbaf589d28fb5c9318f8d9e768ee6339d8
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The dev shell provides helm, which packages the chart.
      - name: Enter the Nix dev shell
        uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1

      # The chart version is the tag without its `v` (v0.1.0 -> 0.1.0), which
      # is what the chart holds as its version and appVersion. metadata-action
      # reports the image tag as the ref writes it (v0.1.0), so strip the prefix
      # here, and refuse a version that does not carry it rather than package a
      # chart whose version the release does not name.
      - name: Derive the chart version from the tag
        id: chart-version
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          if [ -z "$version" ] || [ "$version" = "$VERSION" ]; then
            echo "::error::Expected a v* tag, but metadata-action reported '${VERSION}'"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Lint the chart
        run: helm lint charts/koujouo

      # The same target a local release runs (`make release-chart`), so the
      # archive attached here and the one built from a checkout are identical.
      - name: Package the chart
        env:
          CHART_VERSION: ${{ steps.chart-version.outputs.version }}
        run: make release-chart RELEASE_VERSION="${CHART_VERSION}"

      # `gh release view` fails while the release does not exist yet: create it
      # with the archive then, and upload into it when an earlier run made it
      # (`--clobber` replaces an archive of the same name). The notes name the
      # image tag as it is (`v0.1.0`) and the chart version without its `v`
      # (`0.1.0`); the chart defaults `image.tag` to `latest`, so the install
      # command names the image tag of the release.
      - name: Publish the GitHub Release with the chart archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ needs.meta.outputs.repo }}
          IMAGE_TAG: ${{ needs.meta.outputs.version }}
          CHART_VERSION: ${{ steps.chart-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          archive="koujouo-${CHART_VERSION}.tgz"
          notes="$(
            printf '%s\n' \
              "Multi-arch image (\`linux/amd64\`, \`linux/arm64\`): \`${REPO}:${IMAGE_TAG}\`" \
              "" \
              "Helm chart \`${archive}\`: version and appVersion \`${CHART_VERSION}\`, the tag without its \`v\`" \
              "" \
              '```' \
              "helm upgrade --install koujouo ${archive} -n koujouo-system --create-namespace \\" \
              "  --set image.tag=${IMAGE_TAG}" \
              '```'
          )"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists: uploading the chart archive to it"
            gh release upload "${TAG}" dist/*.tgz --clobber
          else
            gh release create "${TAG}" dist/*.tgz --title "${TAG}" --notes "${notes}"
          fi
          echo "Published ${archive} to the release ${TAG}" | tee -a "$GITHUB_STEP_SUMMARY"
