# This rule is not used by the project koujouo itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over koujouo.anqou.net.koujouo.anqou.net.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: koujouo
    app.kubernetes.io/managed-by: kustomize
  name: factorioserver-admin-role
rules:
- apiGroups:
  - koujouo.anqou.net.koujouo.anqou.net
  resources:
  - factorioservers
  verbs:
  - '*'
- apiGroups:
  - koujouo.anqou.net.koujouo.anqou.net
  resources:
  - factorioservers/status
  verbs:
  - get
