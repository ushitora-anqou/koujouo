resources:
- manager.yaml
# KOUJOUO_CONTROLLER_IMAGE mirrors the manager image into the
# KOUJOUO_CONTROLLER_IMAGE environment variable of the manager
# container; the controller deploys that image to the agent
# StatefulSets. The manager container must stay the first container.
# Vars resolve after the images transformer, so `make deploy` and
# `make build-installer` propagate IMG here.
vars:
- fieldref:
    fieldPath: spec.template.spec.containers[0].image
  name: KOUJOUO_CONTROLLER_IMAGE
  objref:
    apiVersion: apps/v1
    kind: Deployment
    name: controller-manager
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
images:
- name: controller
  newName: example.com/koujouo
  newTag: v0.0.1
