version: "2"
linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - wsl
  enable:
    - exhaustruct_v5
  settings:
    exhaustruct_v5:
      ignore-patterns:
        # The following packages are not designed to conform to this rule.
        - k8s.io/.*
        - sigs.k8s.io/controller-runtime/.*
formatters:
  enable:
    - gofmt
    - goimports
