version: "2"
linters:
  default: all
  enable:
    # The successor of gomodguard, which golangci-lint deprecates since v2.12.0.
    # It needs no settings: neither an allow nor a block list is configured.
    - gomodguard_v2
  disable:
    - depguard
    - exhaustruct
    - gomodguard
    - wsl
  exclusions:
    rules:
      # Tests build values partially on purpose and return the raw error of the
      # code under test, so these linters do not apply to them.
      - path: _test\.go
        linters:
          - exhaustruct_v5
          - gosec
          - wrapcheck
  settings:
    exhaustruct_v5:
      ignore-patterns:
        # The following packages are not designed to conform to this rule.
        - k8s.io/.*
        - sigs.k8s.io/controller-runtime/.*
formatters:
  enable:
    - gofmt
    - goimports
